<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>縉皇居交通 Ocean Point Bus ETA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            font-size: 60px; /* Doubled  from 13px */
            margin: 8px;
            padding: 0;
            background-color: #f4f4f4;
            color: #222;
        }
        h2 {
            font-size: 60px; /* Doubled from 15px */
            margin: 0 0 12px 0;
            padding: 4px;
            background: #e2e2e2;
            text-left;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            background: #fff;
        }
        th, td {
            border: 2px solid #ddd;
            padding: 6px 4px;
            text-left;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        th {
            background-color: #003366;
            color: white;
            font-size: 60px; /*   from 12px */
        }
        .route-badge {
            background-color: #0055ff;
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            display: inline-block;
        }
        .eta-box {
            display: inline-block;
            padding: 2px 8px;
            margin: 0 2px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 60px; /*   from 12px */
            text-left;
        }
        .eta-red { background-color: #d9534f; }
        .eta-orange { background-color: #f0ad4e; }
        .eta-green { background-color: #5cb85c; }
        .eta-grey { background-color: #777777; }
        
        /* Column Width Adjustments for Portrait Smartphone Fit */
        .col-dir { width: 24%; font-size: 38px; } /* Doubled  from 12px */
        .col-route { width: 20%; }
        .col-stop { width: 24%; font-size: 34px; } /* Doubled from 11px */
        .col-eta { width: 32%; }
    </style>
</head>
<body>

    <h2 id="header-title">縉皇居交通 --:--:--</h2>

    <table>
        <thead>
            <tr>
                <th class="col-dir">開往</th>
                <th class="col-route">路線</th>
                <th class="col-stop">發車站</th>
                <th class="col-eta">到站時間 (分鐘)</th>
            </tr>
        </thead>
        <tbody id="eta-table-body">
            <tr><td colspan="4">Loading schedules...</td></tr>
        </tbody>
    </table>

    <script>
        const scheduleData = {
            "TsuenWantoOceanPointe.jpg": {
                col1: ["06:45","07:05","07:25","07:45","08:05","08:25","08:45","09:05","09:25","09:45","10:05","10:25","10:45","11:05","11:25","11:45","12:05","12:25","12:45","13:05","13:45","15:05","15:45","16:05","16:25","16:45","17:05","17:25","17:45","18:05","18:25","18:45","19:05","19:25","19:45","20:05"],
                col2: ["06:45","07:05","07:25","07:45","08:05","08:25","08:45","09:05","09:25","09:45","10:05","10:25","10:45","11:05","11:25","11:45","12:05","12:25","12:45","13:05","13:45","15:05","15:45","16:05","16:25","16:45","17:05","17:25","17:45","18:05","18:25","18:45","19:05","19:25","19:45"],
                col3: ["07:05","07:50","08:35","09:20","10:05","10:50","11:35","12:20","13:05","15:05","15:50","16:35","17:20","18:05","18:50","19:35"]
            },
            "OceanPointeToTsuenWan.jpg": {
                col1: ["06:30","06:50","07:10","07:20","07:30","07:40","07:50","08:00","08:10","08:20","08:30","08:50","09:10","09:30","09:50","10:10","10:30","10:50","11:10","11:30","11:50","12:10","12:30","12:50","13:30","14:50","15:30","15:50","16:10","16:30","16:50","17:10","17:30","17:50","18:10","18:30","18:50","19:10","19:30","19:50"],
                col2: ["06:30","06:50","07:10","07:30","07:50","08:10","08:30","08:50","09:10","09:30","09:50","10:10","10:30","10:50","11:10","11:30","11:50","12:10","12:30","12:50","13:30","14:50","15:30","15:50","16:10","16:30","16:50","17:10","17:30","17:50","18:10","18:30","18:50","19:10","19:30"],
                col3: ["06:50","07:35","08:20","09:05","09:50","10:35","11:20","12:05","12:50","14:50","15:35","16:20","17:05","17:50","18:35","19:20"]
            }
        };

        const instructions = [
            "屋苑 邨巴 縉皇居 荃灣站 TsuenWantoOceanPointe.jpg",
            "屋苑 邨巴 荃灣 縉皇居 OceanPointeToTsuenWan.jpg",
            "KMB 234A 荃灣 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234A/1",
            "KMB 234B 荃灣 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234B/1",
            "KMB 53 荃灣 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/53/1",
            "GMB 96C 荃灣 碧堤半島 https://data.etagmb.gov.hk/eta/route-stop/2008093/2/1",
            "KMB 52X 旺角 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52X/1",
            "CTB 952 銅鑼灣 海韻花園 https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002618/952",
            "KMB A38 機場 深井深慈街 https://data.etabus.gov.hk/v1/transport/kmb/eta/5A2A66038B409879/A38/1",
            "KMB 52X 屯門 碧堤半島 https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/52X/1",
            "KMB 53 元朗 碧堤半島 https://data.etabus.gov.hk/v1/transport/kmb/eta/B47C12A965D7B481/53/1",
            "CTB 952 屯門 碧堤半島 https://rt.data.gov.hk/v2/transport/citybus/eta/ctb/002619/952",
            "KMB 234C 觀塘 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234C/1",
            "KMB 234D 觀塘 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/234D/1",
            "KMB 261B 九龍站 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/261B/1",
            "KMB 48P 火炭 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/48P/1",
            "KMB 52P 旺角 海韻花園 https://data.etabus.gov.hk/v1/transport/kmb/eta/ED9E5ACF98190E5C/52P/1"
        ];

        const hkPublicHolidays2026 = [
            "2026-01-01", "2026-02-17", "2026-02-18", "2026-02-19",
            "2026-04-03", "2026-04-04", "2026-04-06", "2026-04-07",
            "2026-05-01", "2026-05-25", "2026-06-19", "2026-07-01",
            "2026-09-26", "2026-10-01", "2026-10-19", "2026-12-25", "2026-12-26"
        ];

        function getHkCurrentDateObj() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (3600000 * 8));
        }

        function formatDateStr(dateObj) {
            const year = dateObj.getFullYear();
            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
            const day = String(dateObj.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function isPublicHoliday(dateStr) {
            return hkPublicHolidays2026.includes(dateStr);
        }

        function getScheduleColumnKey(dateObj) {
            const dayOfWeek = dateObj.getDay();
            const dateStr = formatDateStr(dateObj);
            
            if (dayOfWeek === 0 || isPublicHoliday(dateStr)) {
                return "col3";
            } else if (dayOfWeek === 6) {
                return "col2";
            } else {
                return "col1";
            }
        }

        function getEtaClass(mins) {
            if (mins < 9) return "eta-red";
            if (mins >= 9 && mins < 15) return "eta-orange";
            return "eta-green";
        }

        function renderEtaBoxes(etas) {
            if (!etas || etas.length === 0) return '<span class="eta-box eta-grey">No ETA</span>';
            return etas.map(m => `<span class="eta-box ${getEtaClass(m)}">${m}</span>`).join(" ");
        }

        function calculateImageScheduleEtas(filename, nowObj) {
            const fileConfig = scheduleData[filename];
            if (!fileConfig) return [];

            const colKey = getScheduleColumnKey(nowObj);
            const timesList = fileConfig[colKey] || [];

            const currentMinutes = nowObj.getHours() * 60 + nowObj.getMinutes();
            const currentSecs = currentMinutes * 60 + nowObj.getSeconds();

            const upcomingMins = [];
            for (let timeStr of timesList) {
                const parts = timeStr.split(":");
                const tMins = parseInt(parts[0]) * 60 + parseInt(parts[1]);
                const diffSecs = (tMins * 60) - currentSecs;
                
                if (diffSecs >= 0) {
                    const diffMins = Math.ceil(diffSecs / 60);
                    upcomingMins.push(diffMins);
                    if (upcomingMins.length === 3) break;
                }
            }
            return upcomingMins;
        }

        async function fetchApiEtas(url, nowObj) {
            try {
                const response = await fetch(url);
                if (!response.ok) return [];
                const json = await response.json();
                
                let rawEtas = [];
                const currentMs = nowObj.getTime();

                if (json.data && Array.isArray(json.data)) {
                    for (let item of json.data) {
                        let etaTimeStr = item.eta;
                        if (etaTimeStr) {
                            let etaMs = new Date(etaTimeStr).getTime();
                            let diffMins = Math.round((etaMs - currentMs) / 60000);
                            if (diffMins >= 0) {
                                rawEtas.push(diffMins);
                            }
                        }
                    }
                } else if (Array.isArray(json)) {
                    for (let item of json) {
                        let etaTimeStr = item.eta;
                        if (etaTimeStr) {
                            let etaMs = new Date(etaTimeStr).getTime();
                            let diffMins = Math.round((etaMs - currentMs) / 60000);
                            if (diffMins >= 0) {
                                rawEtas.push(diffMins);
                            }
                        }
                    }
                }

                rawEtas.sort((a, b) => a - b);
                return rawEtas.slice(0, 3);
            } catch (err) {
                console.error("API fetch error for URL:", url, err);
                return [];
            }
        }

        async function updateBusBoard() {
            const nowObj = getHkCurrentDateObj();
            
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const dStr = String(nowObj.getDate()).padStart(2, '0');
            const mStr = months[nowObj.getMonth()];
            const yStr = nowObj.getFullYear();
            const timeStr = String(nowObj.getHours()).padStart(2, '0') + ":" + 
                            String(nowObj.getMinutes()).padStart(2, '0') + ":" + 
                            String(nowObj.getSeconds()).padStart(2, '0');
            
            document.getElementById("header-title").innerText = `縉皇居交通 ${dStr}-${mStr}-${yStr} ${timeStr}`;

            let htmlOutput = "";

            for (let line of instructions) {
                parts = line.trim().split(/\s+/);
                if (parts.length < 5) continue;

                const busCoId = parts[0];
                const route = parts[1];
                const direction = parts[2];
                const stopName = parts[3];
                const targetSrc = parts.slice(4).join(" ");

                let etas = [];
                if (!targetSrc.startsWith("https://")) {
                    etas = calculateImageScheduleEtas(targetSrc, nowObj);
                } else {
                    etas = await fetchApiEtas(targetSrc, nowObj);
                }

                if (!etas || etas.length === 0) {
                    continue;
                }

                htmlOutput += `<tr>
                    <td class="col-dir">${direction}</td>
                    <td class="col-route"><span class="route-badge">${route}</span></td>
                    <td class="col-stop">${stopName}</td>
                    <td class="col-eta">${renderEtaBoxes(etas)}</td>
                </tr>`;
            }

            if (htmlOutput === "") {
                htmlOutput = `<tr><td colspan="4">No active bus services available at this time.</td></tr>`;
            }

            document.getElementById("eta-table-body").innerHTML = htmlOutput;
        }

        updateBusBoard();
        setInterval(updateBusBoard, 10000);
    </script>
</body>
</html>
